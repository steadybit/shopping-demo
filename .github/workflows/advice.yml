name: Advice Nightly
on:
  schedule:
    - cron: '0 1 1,15 * *'
  workflow_dispatch:

jobs:
  validate_advice:
    runs-on: ubuntu-latest
    name: Validate advice
    permissions:
      contents: read
    env:
      STEADYBIT_TOKEN: ${{ secrets.STEADYBIT_API_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Steadybit CLI
        uses: steadybit/cli@v6

      - name: Validate advice for Service Tier 1
        run: steadybit advice validate-status -e "Online Shop [Stage]" -q k8s.deployment.label.service-tier="1"
        if: "!cancelled()"
