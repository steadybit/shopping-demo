name: Run Chaos Engineering experiments
on:
  workflow_dispatch:
  # Run experiment recurrently to always have some example logs in demos
  schedule:
    - cron: "15 1 1,15 * *"

jobs:
  run_experiments:
    runs-on: ubuntu-latest
    name: Run Experiments
    permissions:
      contents: read
    env:
      STEADYBIT_TOKEN: ${{ secrets.STEADYBIT_API_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Steadybit CLI
        uses: steadybit/cli@v6

      - name: Run experiment via Experiment Key
        run: steadybit experiment run -k GITHUB-16 --yes --timeout 15m
        if: "!cancelled()"

      - name: Run versioned experiments
        run: steadybit experiment run -f experiments/ -R --yes --timeout 15m
        if: "!cancelled()"

