version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: "maven"
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: "gomod"
  directories:
    - "/bestseller-toys-go"
    - "/checkout-go"
    - "/inventory-service-mock-go"
    - "/notification-go"
    - "/order-go"
  schedule:
    interval: "weekly"
- package-ecosystem: "npm"
  directories:
    - "/shopping-ui"
    - "/bestseller-fashion-lambda"
  schedule:
    interval: "weekly"
- package-ecosystem: "docker"
  directories:
    - "/bestseller-fashion"
    - "/bestseller-toys-go"
    - "/checkout-go"
    - "/gateway"
    - "/hot-deals"
    - "/inventory-service-mock-go"
    - "/notification-go"
    - "/order-go"
  schedule:
    interval: "weekly"
