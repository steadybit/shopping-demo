{{- if .Values.gateway.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    run: gateway
    service-tier: "1"
    domain: "shop-gateway"
    tags.steadybit.com/service-validation: "http"
    tags.datadoghq.com/service: shop-gateway
    tags.datadoghq.com/version: 1.0.0
  name: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      run: gateway-exposed
  template:
    metadata:
      labels:
        run: gateway-exposed
        service-tier: "1"
        domain: "shop-gateway"
        tags.steadybit.com/service-validation: "http"
        tags.datadoghq.com/service: shop-gateway
        tags.datadoghq.com/version: 1.0.0
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: steadybit-demo
      {{- if .Values.gateway.extraTrustedCAs.existingSecret }}
      # A JVM reads its truststore once, at startup, and cannot be told to trust
      # an extra authority on top of the default one - it takes a single
      # truststore or none. So build a copy of the JDK's own cacerts with the
      # extra authorities imported, and point the gateway at that copy.
      initContainers:
        - name: import-trusted-cas
          image: {{ .Values.gateway.image.name }}:{{ .Values.gateway.image.tag }}
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -e
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              chmod 0644 /truststore/cacerts
              for cert in /extra-cas/*; do
                keytool -importcert -noprompt -file "$cert" \
                  -alias "extra-$(basename "$cert")" \
                  -keystore /truststore/cacerts -storepass changeit
              done
          resources: {{ toYaml .Values.gateway.extraTrustedCAs.resources | nindent 14 }}
          volumeMounts:
            - name: extra-cas
              mountPath: /extra-cas
              readOnly: true
            - name: java-truststore
              mountPath: /truststore
      {{- end }}
      containers:
        - image: {{ .Values.gateway.image.name}}:{{ .Values.gateway.image.tag }}
          imagePullPolicy: Always
          name: gateway
          resources: {{ toYaml .Values.gateway.resources | nindent 14 }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Dsun.net.inetaddr.ttl=0{{ if .Values.gateway.extraTrustedCAs.existingSecret }} -Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit{{ end }}"
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
            - name: rest.endpoint.fashion
              value: {{ .Values.global.endpoints.bestsellerFashion }}
            - name: rest.endpoint.toys
              value: {{ .Values.global.endpoints.bestsellerToys }}
            - name: rest.endpoint.hotdeals
              value: {{ .Values.global.endpoints.hotDeals }}
            - name: rest.endpoint.checkout
              value: {{ .Values.global.endpoints.checkout }}
            - name: rest.endpoint.inventory
              value: {{ .Values.global.endpoints.inventory }}
            {{- if .Values.activemq.enabled }}
            - name: HEALTH_ACTIVEMQ_HOST
              value: "activemq"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: HEALTH_REDIS_HOST
              value: "{{ .Release.Name }}-redis-master"
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - name: HEALTH_KAFKA_HOST
              value: "{{ .Release.Name }}-kafka"
            {{- end }}
            {{- if .Values.rabbitmq.enabled }}
            - name: HEALTH_RABBITMQ_HOST
              value: "{{ .Release.Name }}-rabbitmq"
            {{- end }}
            {{- if and .Values.rabbitmq.enabled .Values.notification.enabled }}
            - name: HEALTH_NOTIFICATION_HOST
              value: "notification"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: work-dir
              mountPath: /work
            {{- if .Values.gateway.extraTrustedCAs.existingSecret }}
            - name: java-truststore
              mountPath: /truststore
              readOnly: true
            {{- end }}
      volumes:
        - name: work-dir
          emptyDir:
            sizeLimit: 256Mi
        {{- with .Values.gateway.extraTrustedCAs.existingSecret }}
        - name: extra-cas
          secret:
            secretName: {{ . }}
            # Only the keys named in gateway.extraTrustedCAs.keys, so a private
            # key sharing the Secret is never handed to keytool.
            items:
              {{- range $.Values.gateway.extraTrustedCAs.keys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
        - name: java-truststore
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: regcredinternal
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: run
                    operator: In
                    values:
                      - gateway-exposed
              topologyKey: "topology.kubernetes.io/zone"
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    run: gateway
  name: gateway
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    run: gateway-exposed
  type: {{ .Values.gateway.service.type }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      run: gateway-exposed
{{- end -}}